# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Stage 3 evaluation of the Storyboard Adversarial Reviewer (frozen before the baseline run).
#
# FROZEN: after `scripts/reviewer_stage3.py freeze --agent storyboard`, do not edit this file,
# storyboard_tests.json, reviewer_assert.py, reviewer_scoring.py, storyboard_assert.py, storyboard_gates.py,
# thresholds.json or any fixture.
# Every prompt version (evidence/stage3/reviewers/storyboard/prompts/v*.md) is evaluated with this exact
# configuration. The prompt under test is supplied with `--prompts`, the split with
# `--filter-metadata split=dev|holdout`.
#
# Reviewer model: swe-2-medium (the model configured for review gates in config/workflow.yaml)
# Grader model:   fusion-claude-sonnet-5-5-medium-sidekick-claude-haiku-5-5-medium
#                 (separate from the reviewer; used only for the actionable_feedback rubric)
#
# Criteria and weights (see thresholds.json): contradiction_detection 30%, evidence_grounding 25%,
# false_positive_avoidance 20%, issue_classification 15%, actionable_feedback 10%.
# Additional deterministic gate (no weight): blocking_citation - every critical/major non-policy issue must be located
# inside the storyboard and cite a resolving reference (world/brief evidence for rule codes, cast evidence for motivation codes, brief evidence for brief codes).
# Case pass rule: every assertion attached to the case passes (rubric pass = integer score >= 4 of 5).

description: Storyboard Adversarial Reviewer Stage 3 holdout_v2 evaluation (positive cases only)

prompts:
  - file://../../evidence/stage3/reviewers/storyboard/prompts/v1.md

providers:
  - id: file://../world_stage3_provider.py
    config:
      model: swe-2-medium
      timeout: 600000
      devin_timeout: 180
      retries: 1
      respect_workspace_trust: false

tests: file://holdout_v2_storyboard_tests.json

defaultTest:
  options:
    provider:
      id: file://../world_stage3_provider.py
      config:
        model: fusion-claude-sonnet-5-5-medium-sidekick-claude-haiku-5-5-medium
        timeout: 600000
        devin_timeout: 120
        retries: 1
        respect_workspace_trust: false
