[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fictionforge"]

[project]
name = "fictionforge"
version = "0.1.0"
description = "Stage 4 multi-agent fiction planning workflow"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.21,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
